      const WIPE = 0.9;
      [["#w1", "#w2", 6.4], ["#w2", "#w3", 12.8], ["#w3", "#w4", 19.2]].forEach(([out, inc, t], i) => {

        tl.fromTo(out, { y: 0 }, { y: -220, duration: WIPE, ease: "expo.inOut", immediateRender: false }, t);
