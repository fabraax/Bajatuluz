<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/historias.css" />
      <style>
        #root { position: absolute; inset: 0; }
        #hos-frame .hn-h .l1 { font-size: 128px; }
        #hos-frame .hos-tint { position: absolute; inset: 0; background: rgba(13, 39, 32, 0.4); }
        #hos-frame .hos-scrim {
          background: linear-gradient(180deg,
            rgba(13, 39, 32, 0.97) 0%, rgba(13, 39, 32, 0.93) 30%, rgba(13, 39, 32, 0.34) 43%,
            rgba(13, 39, 32, 0.26) 57%, rgba(13, 39, 32, 0.88) 68%, rgba(13, 39, 32, 0.98) 77%, #0d2720 100%);
        }
        #hos-frame .hos-glow { left: 140px; top: 600px; width: 800px; height: 800px;
          background: radial-gradient(circle, rgba(196, 236, 67, 0.22) 0%, rgba(196, 236, 67, 0.07) 40%, rgba(196, 236, 67, 0) 66%); }
        #hos-frame .hos-orbit { position: absolute; left: 260px; top: 720px; width: 560px; height: 560px; overflow: visible; }
        #hos-frame .hos-disc { position: absolute; left: 380px; top: 840px; width: 320px; height: 320px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
        #hos-frame .hos-cup { width: 190px; height: 190px; display: block; overflow: visible; }
        #hos-frame .hos-c1 { left: 84px; top: 866px; }
        #hos-frame .hos-c2 { right: 84px; top: 968px; }
        #hos-frame .hos-c3 { left: 84px; top: 1104px; }
      </style>

      <div id="root" data-composition-id="hosteleria" data-width="1080" data-height="1920" data-duration="7">
        <div class="hn-frame dark" id="hos-frame">
          <div data-layout-allow-overflow class="hn-cam hos-cam"><img src="assets/fondos/hosteleria.jpg" alt="" /></div>
          <div class="hos-tint"></div>
          <div class="hn-scrim hos-scrim"></div>
          <div class="hn-glow hos-glow"></div>
          <div class="hn-grain"></div>

          <div class="hn-hdr">
            <img class="hn-logo" src="assets/logos/logo-ondark.png" alt="BajaTuLuz" />
            <div class="hn-pill"><i class="pd"></i>NEGOCIOS<span class="cnt">01/04</span></div>
          </div>
          <div class="hn-eyebrow"><i class="ln"></i><span class="tx">HOSTELERÍA</span></div>
          <h1 class="hn-h"><span class="l1">¿Restaurante</span><span class="l2wrap"><span class="l2"><span class="t" data-layout-allow-overflow>o cafetería?</span></span></span></h1>

          <svg class="hos-orbit" viewBox="-280 -280 560 560">
            <circle class="hos-ring" r="232" fill="none" stroke="rgba(214,225,209,.34)" stroke-width="2" stroke-dasharray="3 11" />
            <circle class="hos-dot-glow" r="15" fill="#C4EC43" opacity=".45" />
            <circle class="hos-dot" r="8" fill="#C4EC43" />
          </svg>
          <div class="hos-disc hn-glass">
            <svg class="hos-cup" viewBox="0 0 120 120" fill="none" stroke="#C4EC43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
              <path class="hos-steam" d="M46 40c-7-7 7-11 0-19" />
              <path class="hos-steam" d="M60 40c-7-7 7-11 0-19" />
              <path class="hos-steam" d="M74 40c-7-7 7-11 0-19" />
              <path class="hos-draw" d="M28 54h56v16a28 28 0 0 1-28 28 28 28 0 0 1-28-28z" />
              <path class="hos-draw" d="M84 60h5a10 10 0 0 1 0 20h-7" />
              <path class="hos-draw" d="M20 108h76" />
            </svg>
          </div>
          <div class="hn-chip hn-glass hos-c1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.8 1.2 2.7 2.2 3-.4-3 .1-5.5.8-8.5z" /></svg>Cocina</div>
          <div class="hn-chip hn-glass hos-c2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M3.3 7l17.4 10M20.7 7L3.3 17M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5" /></svg>Cámaras de frío</div>
          <div class="hn-chip hn-glass hos-c3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7" /></svg>Climatización</div>

          <p class="hn-body" data-layout-allow-occlusion data-layout-allow-overflow>
            <span class="hn-bl"><span class="hn-bi">Cocina, cámaras de frío, climatización…</span></span>
            <span class="hn-bl"><span class="hn-bi">Antes de revisar el suministro, queremos</span></span>
            <span class="hn-bl"><span class="hn-bi"><strong>entender cómo funciona tu local.</strong></span></span>
          </p>
          <div class="hn-ftr"><i class="hn-rule"></i><div class="row"><span class="hn-handle fi">@bajatuluz</span><span class="hn-next fi">SIGUE PARA CONOCERNOS<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6" /></svg></span></div></div>
          <div class="hn-prog"><div class="hn-seg cur"><i></i></div><div class="hn-seg"><i></i></div><div class="hn-seg"><i></i></div><div class="hn-seg"><i></i></div></div>
        </div>
      </div>

      <script>
        (function () {
          const DUR = 7;
          const R = document.querySelector('[data-composition-id="hosteleria"] #hos-frame');
          const q = (s) => R.querySelector(s);
          const qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          HN.grain(R);
          HN.intro(tl, R, 0.15, DUR);
          HN.kenBurns(tl, q(".hos-cam"), DUR, { s: 1.14, x: 0, y: 40 }, { s: 1.03, x: -24, y: -16 });

          tl.fromTo(q(".hos-glow"), { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0.4);
          tl.fromTo(q(".hos-disc"), { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.55);
          tl.fromTo(q(".hos-ring"), { opacity: 0, rotation: -50, svgOrigin: "0 0" }, { opacity: 1, rotation: 0, svgOrigin: "0 0", duration: 1.4, ease: "expo.out" }, 0.5);
          qa(".hos-draw").forEach((p, i) => {
            const L = p.getTotalLength();
            p.style.strokeDasharray = `${L} ${L}`;
            tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" }, 0.8 + i * 0.12);
          });
          tl.fromTo(qa(".hos-dot, .hos-dot-glow"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.4);
          tl.fromTo(qa(".hn-chip"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
            { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.7)", stagger: 0.14 }, 1.25);

          const steam = qa(".hos-steam");
          const dot = q(".hos-dot"), dotGlow = q(".hos-dot-glow");
          const footer = HN.footerNudge(R);
          HN.ambient(tl, DUR, (t) => {
            const on = Math.min(1, Math.max(0, (t - 1.5) / 0.6));
            steam.forEach((s, j) => {
              const ph = ((t * 0.55 + j * 0.33) % 1 + 1) % 1;
              s.style.transform = `translateY(${-16 * ph}px)`;
              s.style.opacity = (on * Math.sin(Math.PI * ph)).toFixed(3);
            });
            const a = (200 + t * 30) * Math.PI / 180;
            for (const c of [dot, dotGlow]) { c.setAttribute("cx", 232 * Math.sin(a)); c.setAttribute("cy", -232 * Math.cos(a)); }
            q(".hos-glow").style.transform = `scale(${1 + 0.04 * Math.sin(t * 1.6)})`;
            footer(t);
          });

          window.__timelines["hosteleria"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
