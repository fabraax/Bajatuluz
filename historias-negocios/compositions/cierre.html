<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; }
        #cie-frame { position: absolute; inset: 0; overflow: hidden; background: #0d2720; }
        #cie-frame .cie-cam { position: absolute; left: -60px; top: -100px; width: 1200px; height: 2120px; }
        #cie-frame .cie-cam img { display: block; width: 100%; height: 100%; object-fit: cover; }
        #cie-frame .cie-tint { position: absolute; inset: 0;
          background: radial-gradient(760px 760px at 50% 50%, rgba(13, 39, 32, 0.72), rgba(13, 39, 32, 0.95)); }
        #cie-frame .cie-sw { position: absolute; left: 310px; top: 730px; width: 460px; height: 460px; overflow: visible; display: block; }
      </style>
      <div id="root" data-composition-id="cierre" data-width="1080" data-height="1920" data-duration="2.2">
        <div id="cie-frame">
          <div class="cie-cam"><img src="assets/fondos/cierre.jpg" alt="" /></div>
          <div class="cie-tint"></div>
          <svg class="cie-sw" viewBox="-230 -230 460 460">
            <defs>
              <filter id="cie-bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="34" /></filter>
              <linearGradient id="cie-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" /><stop offset=".5" stop-color="#F3F5EC" /><stop offset="1" stop-color="#D5DCC6" /></linearGradient>
              <linearGradient id="cie-off" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DCC6" /><stop offset=".5" stop-color="#F3F5EC" /><stop offset="1" stop-color="#FFFFFF" /></linearGradient>
              <linearGradient id="cie-plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDFEF8" /><stop offset="1" stop-color="#EEF2E4" /></linearGradient>
            </defs>
            <rect class="cie-glow" x="-170" y="-170" width="340" height="340" rx="60" fill="#C4EC43" filter="url(#cie-bl)" opacity=".6" />
            <rect x="-200" y="-200" width="400" height="400" rx="58" fill="url(#cie-plate)" />
            <rect x="-130" y="-130" width="260" height="260" rx="32" fill="#DDE3D0" />
            <g class="cie-rocker">
              <rect x="-120" y="-120" width="240" height="240" rx="26" fill="url(#cie-on)" />
              <rect class="cie-off" x="-120" y="-120" width="240" height="240" rx="26" fill="url(#cie-off)" opacity="0" />
              <rect class="cie-led" x="-24" y="-96" width="48" height="8" rx="4" fill="#C4EC43" />
            </g>
          </svg>
        </div>
      </div>
      <script>
        (function () {
          // el ritual de la marca: aparece el interruptor, clic, y el vídeo completo corta a negro
          const CLICK = 1.0;
          const R = document.querySelector('[data-composition-id="cierre"] #cie-frame');
          const q = (s) => R.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
          tl.fromTo(q(".cie-cam"), { scale: 1.08 }, { scale: 1, duration: 2.2, ease: "none" }, 0);
          tl.fromTo(q(".cie-sw"), { scale: 0.82, y: 40 }, { scale: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0);
          tl.fromTo(q(".cie-off"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, CLICK);
          tl.fromTo(q(".cie-rocker"), { scale: 1, svgOrigin: "0 0" }, { scale: 0.975, svgOrigin: "0 0", duration: 0.05, ease: "power2.out" }, CLICK);
          tl.fromTo(q(".cie-led"), { fill: "#C4EC43" }, { fill: "#B9C2AA", duration: 0.03, ease: "none" }, CLICK);
          tl.fromTo(q(".cie-glow"), { opacity: 0.6 }, { opacity: 0, duration: 0.03, ease: "none" }, CLICK);
          window.__timelines["cierre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
