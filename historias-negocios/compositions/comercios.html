<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/historias.css" />
      <style>
        #root { position: absolute; inset: 0; }
        #com-frame .com-wash { position: absolute; inset: 0; background: rgba(250, 251, 243, 0.12); }
        #com-frame .com-scrim {
          background: linear-gradient(180deg,
            #fafbf3 0%, rgba(250, 251, 243, 0.97) 33%, rgba(250, 251, 243, 0.28) 44%,
            rgba(250, 251, 243, 0.1) 56%, rgba(250, 251, 243, 0.86) 67%, #fafbf3 75%, #fafbf3 100%);
        }
        #com-frame .com-glow { left: 380px; top: -360px; width: 1100px; height: 1100px;
          background: radial-gradient(circle, rgba(196, 236, 67, 0.28), rgba(196, 236, 67, 0) 62%); }
        #com-frame .com-card { position: absolute; left: 84px; top: 806px; width: 912px; height: 452px; border-radius: 44px;
          box-shadow: 0 50px 90px -46px rgba(22, 61, 50, 0.55); overflow: hidden; }
        #com-frame .com-store { position: absolute; left: 44px; top: 70px; width: 270px; height: 310px; display: block; overflow: visible; }
        #com-frame .com-vline { position: absolute; left: 352px; top: 64px; width: 2px; height: 324px; background: rgba(22, 61, 50, 0.16); transform-origin: 50% 0; display: block; }
        #com-frame .com-list { position: absolute; left: 392px; right: 44px; top: 56px; }
        #com-frame .com-row { display: flex; align-items: center; gap: 22px; height: 112px; border-bottom: 2px solid rgba(22, 61, 50, 0.12); }
        #com-frame .com-row:last-child { border-bottom: 0; }
        #com-frame .com-row b { font: 500 22px/1 "JetBrains Mono", monospace; letter-spacing: 0.12em; color: #55695e; width: 40px; }
        #com-frame .com-row span { font: 700 40px/1 "Inter Tight", sans-serif; letter-spacing: -0.025em; color: #163d32; flex: 1; }
        #com-frame .com-ic { width: 64px; height: 64px; border-radius: 20px; background: #163d32; display: flex; align-items: center; justify-content: center; flex: none; }
        #com-frame .com-ic svg { width: 34px; height: 34px; display: block; overflow: visible; }
      </style>

      <div id="root" data-composition-id="comercios" data-width="1080" data-height="1920" data-duration="7">
        <div class="hn-frame light" id="com-frame">
          <div data-layout-allow-overflow class="hn-cam com-cam"><img src="assets/fondos/comercios.jpg" alt="" /></div>
          <div class="com-wash"></div>
          <div class="hn-scrim com-scrim"></div>
          <div class="hn-glow com-glow"></div>
          <div class="hn-grain"></div>

          <div class="hn-hdr">
            <img class="hn-logo" src="assets/logos/logo-color.png" alt="BajaTuLuz" />
            <div class="hn-pill"><i class="pd"></i>NEGOCIOS<span class="cnt">02/04</span></div>
          </div>
          <div class="hn-eyebrow"><i class="ln"></i><span class="tx">COMERCIOS</span></div>
          <h1 class="hn-h"><span class="l1">¿Tienes</span><span class="l2wrap"><span class="l2"><i class="hn-hlbar"></i><span class="t" data-layout-allow-overflow>una tienda?</span></span></span></h1>

          <div class="com-card hn-glass">
            <svg class="com-store" viewBox="0 0 120 138" fill="none" stroke="#163D32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
              <path class="com-draw" d="M14 58v66h92V58" />
              <path class="com-draw" d="M22 14h76l14 30H8z" />
              <path class="com-draw" d="M48 124V88h24v36" />
              <path class="com-draw" d="M22 74h16v14H22z" />
              <g class="com-awn">
                <path d="M8 44a13 13 0 0 0 26 0" fill="#C4EC43" />
                <path d="M34 44a13 13 0 0 0 26 0" fill="#FAFBF3" />
                <path d="M60 44a13 13 0 0 0 26 0" fill="#C4EC43" />
                <path d="M86 44a13 13 0 0 0 26 0" fill="#FAFBF3" />
              </g>
            </svg>
            <i class="com-vline"></i>
            <div class="com-list">
              <div class="com-row"><b>01</b><span>Tu horario</span>
                <i class="com-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#C4EC43" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path class="com-hand-h" d="M12 12V7.5" /><path class="com-hand-m" d="M12 12h4" /></svg></i></div>
              <div class="com-row"><b>02</b><span>Tus equipos</span>
                <i class="com-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#C4EC43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4" /></svg></i></div>
              <div class="com-row"><b>03</b><span>Tu contrato</span>
                <i class="com-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#C4EC43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4" /></svg></i></div>
            </div>
          </div>

          <p class="hn-body" data-layout-allow-occlusion data-layout-allow-overflow>
            <span class="hn-bl"><span class="hn-bi">Tus horarios, equipos y condiciones del</span></span>
            <span class="hn-bl"><span class="hn-bi">contrato importan. Los revisamos antes</span></span>
            <span class="hn-bl"><span class="hn-bi"><strong>de hablar de una tarifa.</strong></span></span>
          </p>
          <div class="hn-ftr"><i class="hn-rule"></i><div class="row"><span class="hn-handle fi">@bajatuluz</span><span class="hn-next fi">SIGUE LEYENDO<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6" /></svg></span></div></div>
          <div class="hn-prog"><div class="hn-seg done"><i></i></div><div class="hn-seg cur"><i></i></div><div class="hn-seg"><i></i></div><div class="hn-seg"><i></i></div></div>
        </div>
      </div>

      <script>
        (function () {
          const DUR = 7;
          const R = document.querySelector('[data-composition-id="comercios"] #com-frame');
          const q = (s) => R.querySelector(s);
          const qa = (s) => R.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          HN.grain(R);
          HN.intro(tl, R, 0.15, DUR);
          HN.kenBurns(tl, q(".com-cam"), DUR, { s: 1.04, x: -30, y: 0 }, { s: 1.12, x: 20, y: -30 });

          tl.fromTo(q(".com-glow"), { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0.3);
          tl.fromTo(q(".com-card"), { y: 90, scale: 0.955, opacity: 0, transformOrigin: "50% 100%" },
            { y: 0, scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.55);
          qa(".com-draw").forEach((p, i) => {
            const L = p.getTotalLength();
            p.style.strokeDasharray = `${L} ${L}`;
            tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 0.85 + i * 0.1);
          });
          tl.fromTo(qa(".com-awn path"), { scaleY: 0, transformOrigin: "50% 0%" },
            { scaleY: 1, duration: 0.55, ease: "back.out(2.2)", stagger: 0.07 }, 1.35);
          tl.fromTo(q(".com-vline"), { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "expo.inOut" }, 0.95);
          tl.fromTo(qa(".com-row"), { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.85, ease: "expo.out", stagger: 0.14 }, 1.15);
          tl.fromTo(qa(".com-ic"), { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)", stagger: 0.14 }, 1.3);

          const hh = q(".com-hand-h"), hm = q(".com-hand-m");
          const footer = HN.footerNudge(R);
          HN.ambient(tl, DUR, (t) => {
            hm.setAttribute("transform", `rotate(${(t * 120) % 360} 12 12)`);
            hh.setAttribute("transform", `rotate(${(t * 10) % 360} 12 12)`);
            q(".com-glow").style.transform = `translate(${24 * Math.sin(t * 0.4)}px, ${18 * Math.cos(t * 0.35)}px)`;
            footer(t);
          });

          window.__timelines["comercios"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
